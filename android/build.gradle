group = "com.example.flutter_battery"
version = "1.0-SNAPSHOT"

buildscript {
    // Keep the plugin usable by older Flutter hosts while upgrading its own wrapper.
    def standalone = project == rootProject
    ext.kotlin_version = standalone ? "2.4.20" : "1.8.22"
    def agpVersion = standalone ? "9.3.1" : "8.7.3"
    ext {
        compileSdkVersion = 35
        minSdkVersion = 21
    }
    
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:$agpVersion")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.example.flutter_battery"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    if (project != rootProject) {
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_11
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    // 添加lintOptions以避免XML资源问题
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    dependencies {
        // AndroidX 核心（NotificationCompat 依赖）
        implementation 'androidx.core:core-ktx:1.16.0'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

        // 测试依赖
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.2.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

if (project == rootProject) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        }
    }
}
